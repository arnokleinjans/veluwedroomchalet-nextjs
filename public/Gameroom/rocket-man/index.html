<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rocket Man Space</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background: #1c66d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: 'Arial Rounded MT Bold', 'Helvetica', sans-serif; }
        canvas { display: block; cursor: pointer; max-width: 100vw; max-height: 100vh; box-shadow: 0 0 50px rgba(0,0,0,0.5); border-radius: 10px; outline: none; }

        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.82); z-index: 100; display:flex; justify-content:center; align-items:center; }
        .overlay.hidden { display: none; }
        .overlay-box { background: linear-gradient(145deg, #0f1f5c, #1a3aaa); border-radius: 24px; padding: 30px 26px; text-align: center; border: 1.5px solid rgba(255,255,255,0.15); max-width: 400px; width: 90%; box-shadow: 0 0 60px rgba(0,0,0,0.7); }
        .overlay-box h2 { color: #ff6b35; font-size: 1.9em; margin-bottom: 6px; text-shadow: 0 2px 12px rgba(255,107,53,0.5); }
        .score-display { color: #FFD700; font-size: 2.5em; font-weight: bold; margin: 10px 0 4px; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
        .score-display span { font-size: 0.4em; color: #8090c0; vertical-align: middle; }

        .new-record { background: linear-gradient(45deg, #ffd700, #ffb300); color: #0f1f5c; font-weight: bold; font-size: .95em; border-radius: 30px; padding: 5px 20px; margin: 6px auto 2px; display: inline-block; letter-spacing: 1px; animation: pulse .7s infinite alternate; }
        .new-record.hidden { display: none; }
        @keyframes pulse { from { transform: scale(1) } to { transform: scale(1.07) } }

        .sb-wrap { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 12px 16px; margin: 14px 0 10px; text-align: left; }
        .sb-wrap h3 { color: #40E0D0; font-size: 0.72em; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 9px; text-align: center; }
        .sb-entry { display: flex; align-items: center; justify-content: space-between; font-size: .82em; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.07); color: #90aad0; }
        .sb-entry:last-child { border-bottom: none; }
        .sb-entry .sb-rank { font-weight: 700; width: 22px; }
        .sb-entry.r1 .sb-rank { color: #ffd700; }
        .sb-entry.r2 .sb-rank { color: #c0c0c0; }
        .sb-entry.r3 .sb-rank { color: #cd7f32; }
        .sb-entry .sb-score { font-weight: 600; color: #d0e4ff; }
        .sb-entry.is-new .sb-score { color: #FFD700; }
        .sb-empty { font-size: .78em; color: #40506a; text-align: center; padding: 8px 0; }

        .play-btn { padding: 14px 44px; font-size: 1.05em; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; background: linear-gradient(45deg, #ff6b35, #ff9c00); color: #fff; transition: all .2s; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; box-shadow: 0 4px 20px rgba(255,107,53,0.45); }
        .play-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,107,53,0.65); }
        .play-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <canvas id="gameCanvas" tabindex="0"></canvas>

    <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-box">
            <h2>💥 GAME OVER!</h2>
            <div class="score-display" id="finalScore">0 <span>punten</span></div>
            <div id="newRecordBadge" class="new-record hidden">🏆 Nieuw Record!</div>
            <div class="sb-wrap">
                <h3>Topscores</h3>
                <div id="scoreboardList"></div>
            </div>
            <button class="play-btn" id="restartBtn">🚀 Opnieuw</button>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 480, H = 720;
    canvas.width = W; canvas.height = H;

    // ── Images ──────────────────────────────────────────────────────────
    const images = {}, imageStatus = {};
    const imagePaths = {
        rocket: 'resources/rocket.png',
        papa1: 'resources/papa1.png', papa2: 'resources/papa2.png', papa3: 'resources/papa3.png',
        mama1: 'resources/mama1.png', mama2: 'resources/mama2.png', mama3: 'resources/mama3.png',
        meisje1: 'resources/meisje1.png', meisje2: 'resources/meisje2.png', meisje3: 'resources/meisje3.png', meisje4: 'resources/meisje4.png',
        neef1: 'resources/neef1.png', neef2: 'resources/neef2.png', neef3: 'resources/neef3.png',
        zoon1: 'resources/zoon1.png', zoon2: 'resources/zoon2.png', zoon3: 'resources/zoon3.png',
        coin1: 'resources/coin1.png', coin2: 'resources/coin2.png', coin3: 'resources/coin3.png',
        coin4: 'resources/coin4.png', coin5: 'resources/coin5.png', coin6: 'resources/coin6.png',
        coin7: 'resources/coin7.png', coin8: 'resources/coin8.png', coin9: 'resources/coin9.png',
    };

    function loadImages(cb) {
        let loaded = 0;
        const keys = Object.keys(imagePaths), total = keys.length;
        keys.forEach(k => {
            const img = new Image();
            img.onload = () => { imageStatus[k] = true; loaded++; if (loaded >= total) cb(); };
            img.onerror = () => { imageStatus[k] = false; loaded++; if (loaded >= total) cb(); };
            img.src = imagePaths[k]; images[k] = img;
        });
        setTimeout(() => { if (loaded < total) cb(); }, 1500);
    }

    // ── Audio ────────────────────────────────────────────────────────────
    let audioCtx = null, musicInterval = null, noteIndex = 0;
    const melody = [130, 146, 164, 174, 196, 220, 246, 261];

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!musicInterval) startMusic();
        canvas.focus();
    }

    function playTone(f, d, t = 'sine', v = 0.1) {
        if (!audioCtx || audioCtx.state === 'suspended') return;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    function startMusic() {
        musicInterval = setInterval(() => {
            if (['playing', 'menu', 'waiting'].includes(state)) {
                let speedMod = state === 'playing' ? Math.min(200, score + coinScore) : 0;
                playTone((melody[noteIndex % melody.length] + speedMod * 0.5) / 2, 0.4, 'triangle', 0.03);
                noteIndex++;
            }
        }, 250);
    }

    function playRecordSound() {
        [440, 554, 659, 880].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 'sine', 0.1), i * 150));
    }

    // ── Scoreboard ───────────────────────────────────────────────────────
    let highScore = parseInt(localStorage.getItem('rocketman_hs') || '0');
    let topScores = JSON.parse(localStorage.getItem('rocketman_scores') || '[]');

    function saveAndRender(s) {
        let isNew = false;
        topScores.push({ s });
        topScores.sort((a, b) => b.s - a.s);
        topScores = topScores.slice(0, 5);
        localStorage.setItem('rocketman_scores', JSON.stringify(topScores));
        if (s > highScore) { highScore = s; localStorage.setItem('rocketman_hs', s); isNew = true; }

        document.getElementById('finalScore').innerHTML = `${s} <span>punten</span>`;
        document.getElementById('newRecordBadge').classList.toggle('hidden', !isNew);

        const medals = ['★', '▲', '●'];
        const newIdx = topScores.findIndex(e => e.s === s);
        const list = document.getElementById('scoreboardList');
        list.innerHTML = topScores.length === 0
            ? '<div class="sb-empty">Nog geen scores</div>'
            : topScores.map((e, i) => `<div class="sb-entry r${i+1}${i === newIdx ? ' is-new' : ''}">
                <span class="sb-rank">${i < 3 ? medals[i] : (i+1) + '.'}</span>
                <span class="sb-score">${e.s} punten</span>
              </div>`).join('');
    }

    function showGameOver() {
        saveAndRender(score + coinScore);
        document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    document.getElementById('restartBtn').addEventListener('click', () => {
        document.getElementById('gameOverOverlay').classList.add('hidden');
        resetGame();
    });

    // ── Game state ───────────────────────────────────────────────────────
    let GRAVITY = 0.42, BOOST = -7.5;
    const COMET_SIZE = 120, COIN_SIZE = 36;
    let state = 'menu';
    let score = 0, coinScore = 0, speed = 3.5, frameCount = 0;
    let rocket = { x: 80, y: H/2, vy: 0, angle: 0, invul: 0 };
    let comets = [], coins = [], stars = [], particles = [];
    let animFrame = 0, recordBeaten = false;

    function createStars() {
        stars = [];
        for (let i = 0; i < 60; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2, sp: Math.random() });
    }

    function spawnParticle(x, y, color, speedX, size) {
        particles.push({ x, y, vx: speedX, vy: Math.random()*2-1, life: 1, c: color, s: size, decay: 0.04 });
    }

    function resetGame() {
        rocket = { x: 80, y: H/2 - 25, vy: 0, angle: 0, invul: 0 };
        GRAVITY = 0.42; comets = []; coins = []; particles = [];
        score = 0; coinScore = 0; speed = 3.5; frameCount = 0;
        recordBeaten = false;
        state = 'waiting';
        initAudio();
    }

    // ── Update ───────────────────────────────────────────────────────────
    function update() {
        frameCount++;
        if (state !== 'playing' && state !== 'dead') {
            rocket.y = (H/2 - 25) + Math.sin(frameCount * 0.05) * 15;
            rocket.angle = Math.sin(frameCount * 0.05) * 5;
            if (state !== 'waiting') return;
        }

        if (state === 'playing') {
            const total = score + coinScore;
            if (!recordBeaten && total > highScore && highScore > 0) { recordBeaten = true; playRecordSound(); }
            speed = 3.5 + (frameCount / 900) + (total / 200);
            rocket.vy += GRAVITY; rocket.y += rocket.vy;
            rocket.angle = Math.max(-20, Math.min(35, rocket.vy * 3));
            if (rocket.y < 0 || rocket.y > H) { die(); return; }
            spawnParticle(rocket.x+5, rocket.y+20, '#ff6b35', -Math.random()*5-3, 6);

            if (frameCount % Math.max(35, 65 - Math.floor(total / 40)) === 0) {
                const types = [{n:'papa',c:3},{n:'mama',c:3},{n:'meisje',c:4},{n:'neef',c:3},{n:'zoon',c:3}];
                comets.push({ x: W+150, y: 50+Math.random()*(H-200), t: types[Math.floor(Math.random()*types.length)], s: false, hue: Math.floor(Math.random()*360) });
            }
            if (frameCount % 160 === 0) {
                let r = Math.random(), type = 'gold';
                if (r < 0.10) type = 'red'; else if (r < 0.18) type = 'green'; else if (r < 0.40) type = 'blue';
                coins.push({ x: W+50, y: 50+Math.random()*(H-100), type });
            }

            comets.forEach(c => {
                c.x -= speed;
                if (!c.s && c.x < rocket.x) { c.s = true; score++; playTone(600, 0.1, 'sine', 0.03); }
                if (rocket.invul <= 0 && rocket.x < c.x+COMET_SIZE-45 && rocket.x+55 > c.x+45 && rocket.y < c.y+COMET_SIZE-45 && rocket.y+35 > c.y+45) { die(); return; }
            });
            coins.forEach((c, i) => {
                c.x -= speed;
                if (rocket.x < c.x+COIN_SIZE && rocket.x+60 > c.x && rocket.y < c.y+COIN_SIZE && rocket.y+40 > c.y) {
                    if (c.type === 'red') { die(); return; }
                    else if (c.type === 'green') { rocket.invul = 10; playTone(400, 0.5, 'square', 0.1); }
                    else if (c.type === 'blue') { for (let j = 0; j < 10; j++) coins.push({ x: W+(j*45), y: c.y, type: 'gold' }); playTone(1500, 0.3, 'square', 0.1); }
                    else { coinScore += 5; playTone(900, 0.2, 'sine', 0.15); }
                    coins.splice(i, 1);
                }
            });
            if (rocket.invul > 0) rocket.invul--;
        }

        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1); });
        comets = comets.filter(c => c.x > -200);
        coins = coins.filter(c => c.x > -500);
        if (frameCount % 8 === 0) animFrame++;
    }

    function die() {
        if (state !== 'dead') { state = 'dead'; playTone(100, 0.6, 'sawtooth', 0.2); showGameOver(); }
    }

    // ── Draw ─────────────────────────────────────────────────────────────
    function drawLogo() {
        const cx = W/2, cy = 185;
        ctx.fillStyle = '#FFD700'; ctx.font = '44px serif'; ctx.textAlign = 'center'; ctx.fillText('🚀', cx, cy - 72);
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
        const g = ctx.createLinearGradient(0, cy-52, 0, cy);
        g.addColorStop(0, '#FF8C00'); g.addColorStop(1, '#FFA500');
        ctx.fillStyle = g; ctx.font = 'bold 65px sans-serif'; ctx.fillText('ROCKETMAN', cx, cy);
        ctx.fillStyle = '#40E0D0'; ctx.font = 'bold 55px sans-serif'; ctx.fillText('SPACE', cx, cy + 62);
        ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }

    function drawStartButton() {
        const bx = W/2-120, by = H-155, bw = 240, bh = 65;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.roundRect(bx, by+5, bw, bh, 35); ctx.fill();
        const bg = ctx.createLinearGradient(bx, by, bx, by+bh);
        bg.addColorStop(0, '#ff9c00'); bg.addColorStop(1, '#ff6b35');
        ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 35); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('🚀  START', W/2, by + bh/2 + 8);
    }

    function draw() {
        const total = score + coinScore;
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#2a82fb'); bgGrad.addColorStop(1, '#1346af');
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
        stars.forEach(s => { s.x -= s.sp; if (s.x < 0) s.x = W; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(s.x, s.y, s.s, s.s); });

        if (state === 'menu') {
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0,0,W,H);
            drawLogo();
            ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(W/2-130, 295, 260, 165, 16); ctx.fill();
            ctx.fillStyle = '#d0e8ff'; ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
            ctx.fillText('🔵  Blauw: Coin streak', W/2-110, 330);
            ctx.fillText('🟢  Groen: Schild', W/2-110, 360);
            ctx.fillText('🔴  Rood: GAME OVER!', W/2-110, 390);
            ctx.fillText('🪐  Planeten: Ontwijk!', W/2-110, 420);
            if (highScore > 0) {
                ctx.fillStyle = '#FFD700'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`🏆  Record: ${highScore} punten`, W/2, 455);
            }
            drawStartButton();

        } else {
            // Game world
            particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.life * p.s, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1;

            coins.forEach(c => {
                ctx.save();
                const imgKey = 'coin' + ((animFrame % 9) + 1);
                if (c.type === 'red') { ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(c.x+COIN_SIZE/2, c.y+COIN_SIZE/2, COIN_SIZE/2, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText('✕', c.x+COIN_SIZE/2, c.y+COIN_SIZE/2+7); }
                else if (c.type === 'green') { ctx.fillStyle='#26d6a1'; ctx.beginPath(); ctx.arc(c.x+COIN_SIZE/2, c.y+COIN_SIZE/2, COIN_SIZE/2, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText('🛡', c.x+COIN_SIZE/2, c.y+COIN_SIZE/2+7); }
                else if (c.type === 'blue') { ctx.fillStyle='#4488ff'; ctx.beginPath(); ctx.arc(c.x+COIN_SIZE/2, c.y+COIN_SIZE/2, COIN_SIZE/2, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center'; ctx.fillText('×10', c.x+COIN_SIZE/2, c.y+COIN_SIZE/2+7); }
                else if (imageStatus[imgKey]) ctx.drawImage(images[imgKey], c.x, c.y, COIN_SIZE, COIN_SIZE);
                ctx.restore();
            });

            comets.forEach(c => {
                const imgKey = c.t.n + ((animFrame % c.t.c) + 1);
                if (imageStatus[imgKey]) { ctx.save(); ctx.filter = `hue-rotate(${c.hue}deg)`; ctx.drawImage(images[imgKey], c.x, c.y, COMET_SIZE, COMET_SIZE); ctx.restore(); }
            });

            if (rocket.invul > 0 && Math.floor(frameCount / 3) % 2 === 0) { /* blink — skip draw */ }
            else {
                ctx.save(); ctx.translate(rocket.x+30, rocket.y+20); ctx.rotate(rocket.angle*Math.PI/180);
                if (imageStatus['rocket']) ctx.drawImage(images.rocket, -40, -25, 80, 50);
                ctx.restore();
            }

            // HUD
            if (recordBeaten) { ctx.fillStyle = '#FFD700'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🏆 NIEUW RECORD!', W/2, 28); }
            ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(total, W/2, 68);

            if (state === 'waiting') {
                ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(W/2-165, H/2+55, 330, 52, 26); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('Klik, tik of druk SPATIE!', W/2, H/2 + 87);
            }
        }

        update();
        requestAnimationFrame(draw);
    }

    // ── Input ────────────────────────────────────────────────────────────
    function boost() {
        initAudio();
        if (state === 'waiting' || state === 'playing') { state = 'playing'; rocket.vy = BOOST; }
        else if (state === 'menu') resetGame();
    }

    function handleMenuClick(canvasY) {
        // Only block on the START button area in menu
        if (state === 'menu' && canvasY > H-155 && canvasY < H-90) { resetGame(); initAudio(); }
        else if (state === 'menu') { /* click elsewhere on menu = nothing */ }
        else boost();
    }

    window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); boost(); }
    });

    canvas.addEventListener('mousedown', e => {
        const rect = canvas.getBoundingClientRect();
        const cy = (e.clientY - rect.top) * (H / rect.height);
        handleMenuClick(cy);
    });

    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        boost(); // overal tikken werkt op touch — geen precisie nodig
    }, { passive: false });

    canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

    // ── Boot ─────────────────────────────────────────────────────────────
    createStars();
    loadImages(() => { draw(); });
    </script>
</body>
</html>
